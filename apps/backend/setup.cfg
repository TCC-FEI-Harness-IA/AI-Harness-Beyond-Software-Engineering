[flake8]
max-line-length = 120
exclude = .venv,.env,__pycache__,build,dist
per-file-ignores =
    __init__.py:F401
max-complexity = 12

[tool:pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --cov=src --cov-report=term-missing --cov-fail-under=100
