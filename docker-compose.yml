# Produção: Nginx com TLS na borda (frontend, /auth e /v1 na mesma origem); backend, auth e MongoDB
# só na rede interna do Compose, sem portas publicadas.
#
# Pré-requisitos (ver README):
#   ./scripts/generate-secrets.sh        # segredos em ./secrets (fora do Git)
#   certificados em ./deploy/certs/{fullchain,privkey}.pem   (teste local: ./scripts/generate-local-cert.sh)
#   apps/backend/.env e apps/auth/.env (cp .env.example .env), e PUBLIC_HOST/PUBLIC_ORIGIN no .env da raiz
#
# Uso: docker compose up --build -d
services:
  frontend:
    build:
      context: ./apps/frontend
      target: prod
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - auth
    networks:
      - app
    restart: unless-stopped

  backend:
    build:
      context: ./apps/backend
      target: prod
    env_file:
      - ./apps/backend/.env
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
      PUBLIC_ORIGINS: ${PUBLIC_ORIGIN:-https://localhost}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-https://localhost}
      AUTH_SERVICE_URL: http://auth:8001
      MONGODB_URI: mongodb://mongo:27017
      AUTH_INTERNAL_TOKEN_FILE: /run/secrets/auth_internal_token
      LLM_CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/llm_credential_encryption_key
    secrets:
      - auth_internal_token
      - llm_credential_encryption_key
    volumes:
      - backend_data:/app/data
    depends_on:
      - mongo
      - auth
    networks:
      - app
    restart: unless-stopped

  auth:
    build:
      context: ./apps/auth
      target: prod
    env_file:
      - ./apps/auth/.env
    environment:
      APP_ENV: production
      AUTH_COOKIE_SECURE: "true"
      PUBLIC_ORIGINS: ${PUBLIC_ORIGIN:-https://localhost}
      # O Nginx do projeto define X-Real-IP; o serviço não é alcançável por fora dele.
      AUTH_TRUST_PROXY_HEADERS: "true"
      AUTH_MONGODB_URI: mongodb://mongo:27017
      AUTH_INTERNAL_TOKEN_FILE: /run/secrets/auth_internal_token
    secrets:
      - auth_internal_token
    depends_on:
      - mongo
    networks:
      - app
    restart: unless-stopped

  # Usuários e sessões de autenticação (banco tcc_auth), catálogo de modelos e, com
  # RALPH_SESSION_STORAGE_BACKEND=mongodb, os dados do backend. Sem porta publicada.
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    networks:
      - app
    restart: unless-stopped

secrets:
  auth_internal_token:
    file: ./secrets/auth_internal_token
  llm_credential_encryption_key:
    file: ./secrets/llm_credential_encryption_key

networks:
  app:
    driver: bridge

volumes:
  backend_data:
  mongo_data:
