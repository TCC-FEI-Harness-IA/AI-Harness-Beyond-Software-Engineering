# Ambiente de desenvolvimento: código montado como volume, hot-reload nos dois lados.
# Uso: docker compose -f docker-compose.dev.yml up --build
#
# Pré-requisito: apps/backend/.env e apps/frontend/.env preenchidos
# (cp apps/*/.env.example apps/*/.env).
services:
  backend:
    build:
      context: ./apps/backend
      target: dev
    env_file:
      - ./apps/backend/.env
    environment:
      # Nome do serviço `mongo` nesta mesma rede, não `localhost` do .env local.
      MONGODB_URI: mongodb://mongo:27017
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app
      - backend_data:/app/data
      - "./teste benchmark:/opt/benchmark:ro"
    depends_on:
      - mongo
    networks:
      - app

  # Usado quando RALPH_SESSION_STORAGE_BACKEND=mongodb (ver apps/backend/.env). O volume
  # nomeado `mongo_data` sobrevive a `docker compose down` — só `down -v` apaga os dados.
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app

  frontend:
    build:
      context: ./apps/frontend
      target: dev
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  backend_data:
  mongo_data:
  frontend_node_modules:
